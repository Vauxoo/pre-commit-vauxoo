[bumpversion]
current_version = 0.16.3.32
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)\.(?P<build>\d+)
serialize = {major}.{minor}.{patch}.{build}
commit = True
tag = False
message = [IMP] cfg: Update ruff-odoo to {new_version}

[bumpversion:file:src/pre_commit_vauxoo/cfg/.pre-commit-config.yaml.jinja]
search = rev: {current_version}{{# b2v-ruff #}}
replace = rev: {new_version}{{# b2v-ruff #}}

[bumpversion:file:src/pre_commit_vauxoo/cfg/.pre-commit-config-optional.yaml.jinja]
search = rev: {current_version}{{# b2v-ruff #}}
replace = rev: {new_version}{{# b2v-ruff #}}

[bumpversion:file:src/pre_commit_vauxoo/cfg/{% if use_ruff %}.pre-commit-config-autofix.yaml{% endif %}.jinja]
search = rev: {current_version}{{# b2v-ruff #}}
replace = rev: {new_version}{{# b2v-ruff #}}
